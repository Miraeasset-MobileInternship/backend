api:
  data-go-kr:
    key: {key}
    url: {url}
  yahoo-finance:
    key: {key}
    yh-url: {url}
    sa-url: {url}
  rapid-api-yahoo-finance:
    key: {key}
    host: {host}
    url: {url}
  naver-translator:
    client-id: {client_id}
    client-secret: {client_secret}
    url: {url}

jwt:
  key: {key}

coolsms:
  api-key: {key}
  api-secret: {secret}
  from-number: {phone_number}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://{host}:{port}/{schema}?serverTimezone=Asia/Seoul
    username: {username}
    password: {password}
  redis:
    host: {host}
    port: {port}
  cache:
    type: redis
